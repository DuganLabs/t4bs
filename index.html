<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0B09" />
    <meta name="color-scheme" content="dark" />
    <meta name="generator" content="BaseNative — basenative.dev" />

    <!-- T4BS · Time For BS · made by The Synonym Toast Bunch -->
    <title>Tabs — quick category puzzles</title>
    <meta name="description" content="Pick a category. Solve the hidden phrase. Stake the letters you're sure about." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tabs — quick category puzzles" />
    <meta property="og:description" content="Pick a category. Solve the hidden phrase. Stake the letters you're sure about." />
    <meta property="og:image" content="https://t4bs.com/og/default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tabs — quick category puzzles" />
    <meta property="og:url" content="https://t4bs.com" />
    <meta property="og:site_name" content="Tabs" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tabs — quick category puzzles" />
    <meta name="twitter:description" content="Pick a category. Solve the hidden phrase. Stake the letters you're sure about." />
    <meta name="twitter:image" content="https://t4bs.com/og/default.png" />
    <meta name="twitter:image:alt" content="Tabs — quick category puzzles" />

    <!-- iOS / web app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tabs" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="canonical" href="https://t4bs.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Font hosting: preconnect cuts ~150ms of TLS+DNS off first-paint.
         The actual @import lives in App.css-in-JS; this only warms the
         connection so the import resolves faster. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&family=Caveat:wght@700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&family=Caveat:wght@700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&family=Caveat:wght@700&display=swap"
      />
    </noscript>

    <!-- Structured data — Game schema. Helps rich-result eligibility and
         confirms canonical name + URL to crawlers. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Game",
        "name": "Tabs",
        "alternateName": "T4BS",
        "url": "https://t4bs.com/",
        "image": "https://t4bs.com/og/default.png",
        "description": "Pick a category. Solve the hidden phrase. Stake the letters you're sure about.",
        "genre": "Word puzzle",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "author": { "@type": "Organization", "name": "The Synonym Toast Bunch" },
        "publisher": { "@type": "Organization", "name": "BaseNative", "url": "https://basenative.dev" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div class="noscript-msg">
        <h1>TABS</h1>
        <p>This game needs JavaScript. Enable it and reload to play.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
