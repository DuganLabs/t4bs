# Reference for what should live in Doppler.
# Project: t4bs   Environment/Config: repository  (DuganLabs convention)
#
#   doppler setup -p t4bs -c repository
#   doppler secrets set CLOUDFLARE_API_TOKEN=... CLOUDFLARE_ACCOUNT_ID=... CLOUDFLARE_ZONE_ID=...

# Required secrets
#   CLOUDFLARE_API_TOKEN
#       Custom token, no expiry, with the following:
#         Account · Cloudflare Pages · Edit
#         Account · D1               · Edit
#         Zone    · DNS              · Edit       (for custom domain DNS records)
#         Zone    · Workers Routes   · Edit
#         Zone    · Zone             · Read
#         Account Resources: Include → Dugan Labs
#         Zone Resources:    Include → Specific zone → t4bs.com
#       Used by:  GitHub Actions deploy + local `wrangler pages deploy`.
#       Reuse: this token is shared across DuganLabs projects (same scopes work).
#
#   CLOUDFLARE_ACCOUNT_ID
#       Cloudflare account ID (visible in dashboard sidebar). Used by wrangler.
#
#   CLOUDFLARE_ZONE_ID
#       Zone ID for t4bs.com. Used when scripting DNS records.

# Optional / future. Currently the app has zero runtime secrets — passkey
# challenges live in D1 with TTL, not signed by a server key. Add here only
# when you introduce things like a Sentry DSN, an email provider key, etc.
