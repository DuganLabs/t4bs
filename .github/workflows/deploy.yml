name: deploy

# Thin caller. The actual lift lives in DuganLabs/.github reusable workflows.
# Boundary rule: this file passes only secrets + project-specific inputs;
# the org-wide workflows know nothing about our Cloudflare account or DB id.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: DuganLabs/.github/.github/workflows/cf-deploy.yml@v1
    with:
      project-name: t4bs
      build-command: build
      build-output-dir: dist
      package-manager: npm
      environment: production
      environment-url: https://t4bs.com
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

  migrate:
    needs: deploy
    if: github.event_name == 'push'
    uses: DuganLabs/.github/.github/workflows/d1-migrate.yml@v1
    with:
      database: tabs-db
      migrations-glob: "migrations/*.sql"
      package-manager: npm
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
